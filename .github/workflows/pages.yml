# Build the TanStack Start app with Bun and deploy to GitHub Pages.
# Captures SSR-rendered HTML via wrangler for a fully pre-rendered site.

name: Deploy to GitHub Pages

on:
  push:
    branches: [pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_PATH: /${{ github.event.repository.name }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build with base path
        run: bun run build --base=${{ env.BASE_PATH }}/

      - name: Inspect build output
        run: |
          echo "--- dist ---"
          ls -la dist || true
          echo "--- dist/server ---"
          ls -la dist/server || true

      - name: Locate built app
        run: |
          CLIENT_DIR=""
          for candidate in dist/client .output/public dist/public; do
            if [ -d "$candidate" ]; then
              CLIENT_DIR="$candidate"
              break
            fi
          done

          if [ -z "$CLIENT_DIR" ]; then
            echo "ERROR: no client output directory was found."
            find dist .output -maxdepth 3 -type f 2>/dev/null | sort || true
            exit 1
          fi

          WRANGLER_CONFIG=$(find dist .output -type f \( -name 'wrangler.json' -o -name 'wrangler.jsonc' \) 2>/dev/null | head -n 1 || true)
          if [ -z "$WRANGLER_CONFIG" ]; then
            SERVER_DIR=""
            for candidate in dist/server .output/server dist; do
              if [ -d "$candidate" ] && find "$candidate" -maxdepth 1 -type f \( -name '*.mjs' -o -name '*.js' \) | grep -q .; then
                SERVER_DIR="$candidate"
                break
              fi
            done

            if [ -z "$SERVER_DIR" ]; then
              echo "ERROR: no server bundle was found in any supported build location."
              find dist .output -maxdepth 3 -type f 2>/dev/null | sort || true
              exit 1
            fi

            echo "Worker config missing - generating a fallback config in $SERVER_DIR."
            MAIN=$(find "$SERVER_DIR" -maxdepth 1 -type f \( -name 'index.mjs' -o -name 'index.js' -o -name 'server.mjs' -o -name 'server.js' -o -name '*.mjs' -o -name '*.js' \) -printf '%f\n' | sort | head -n 1)
            if [ -z "$MAIN" ]; then
              echo "ERROR: no JavaScript server entry found in $SERVER_DIR"
              ls -la "$SERVER_DIR"
              exit 1
            fi
            echo "Using server entry: $MAIN"
            ASSETS_DIR=$(realpath --relative-to="$SERVER_DIR" "$CLIENT_DIR")
            printf '%s\n' \
              '{' \
              '  "compatibility_date": "2025-09-24",' \
              '  "name": "tanstack-start-app",' \
              '  "compatibility_flags": ["nodejs_compat"],' \
              "  \"main\": \"$MAIN\"," \
              "  \"assets\": { \"binding\": \"ASSETS\", \"directory\": \"$ASSETS_DIR\" }," \
              '  "no_bundle": true,' \
              '  "rules": [{ "type": "ESModule", "globs": ["**/*.mjs", "**/*.js"] }]' \
              '}' > "$SERVER_DIR/wrangler.json"
            WRANGLER_CONFIG="$SERVER_DIR/wrangler.json"
          fi

          echo "CLIENT_DIR=$CLIENT_DIR" >> "$GITHUB_ENV"
          echo "WRANGLER_CONFIG=$WRANGLER_CONFIG" >> "$GITHUB_ENV"
          echo "Client output: $CLIENT_DIR"
          echo "Worker config: $WRANGLER_CONFIG"
          cat "$WRANGLER_CONFIG"
          touch "$CLIENT_DIR/.nojekyll"

      - name: Capture SSR-rendered HTML
        run: |
          bunx wrangler dev \
            --config "$WRANGLER_CONFIG" \
            --port 8788 --ip localhost --inspector-port 0 --local > /tmp/wrangler.log 2>&1 &
          WRANGLER_PID=$!



          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8788 2>/dev/null; then
              SERVER_READY=true
              break
            fi
            sleep 1
          done

          if [ "$SERVER_READY" != true ]; then
            echo "ERROR: wrangler dev did not start within 60 seconds"
            echo "--- wrangler log ---"
            cat /tmp/wrangler.log || true
            kill $WRANGLER_PID 2>/dev/null || true
            exit 1
          fi


          BASE="${{ env.BASE_PATH }}"

          curl -fsSL "http://localhost:8788${BASE}/" > "$CLIENT_DIR/index.html"

          # Pre-render every page listed in the sitemap so deep links and hard
          # reloads (e.g. /templates/<slug>) resolve to a real HTML file.
          curl -sSL "http://localhost:8788${BASE}/sitemap.xml" > /tmp/sitemap.xml
          cp /tmp/sitemap.xml "$CLIENT_DIR/sitemap.xml"
          PATHS=$(grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml \
            | sed -e 's|<loc>||' -e 's|</loc>||' \
            | sed -e 's|https\?://[^/]*||' || true)

          for p in $PATHS; do
            case "$p" in
              */sitemap.xml) continue ;;
            esac
            # strip the base path to get the location inside dist/client
            rel="${p#$BASE}"
            rel="${rel%/}"
            [ -n "$rel" ] || continue
            out="$CLIENT_DIR${rel}/index.html"
            mkdir -p "$(dirname "$out")"
            curl -sSL "http://localhost:8788${p}" > "$out"
            echo "Captured $out ($(wc -c < "$out") bytes)"
          done


          # SPA-style fallback for any unlisted path.
          cp "$CLIENT_DIR/index.html" "$CLIENT_DIR/404.html"

          kill $WRANGLER_PID 2>/dev/null || true
          wait $WRANGLER_PID 2>/dev/null || true

          SIZE=$(wc -c < "$CLIENT_DIR/index.html")
          echo "Captured $CLIENT_DIR/index.html ($SIZE bytes)"
          if [ "$SIZE" -lt 100 ]; then
            echo "ERROR: captured HTML is too small ($SIZE bytes)"
            head -5 "$CLIENT_DIR/index.html"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.CLIENT_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
