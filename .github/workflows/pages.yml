# Build the TanStack Start app with Bun and deploy to GitHub Pages.
# Captures SSR-rendered HTML via wrangler for a fully pre-rendered site.

name: Deploy to GitHub Pages

on:
  push:
    branches: [pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_PATH: /${{ github.event.repository.name }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build with base path
        run: bun run build --base=${{ env.BASE_PATH }}/

      - name: Inspect build output
        run: |
          echo "--- dist ---"
          ls -la dist || true
          echo "--- dist/server ---"
          ls -la dist/server || true

      - name: Ensure worker config exists
        run: |
          if [ ! -d dist/server ]; then
            echo "ERROR: dist/server is missing; the build did not produce a server bundle."
            exit 1
          fi
          if [ ! -f dist/server/wrangler.json ]; then
            echo "dist/server/wrangler.json missing - generating a fallback config."
            MAIN=index.mjs
            [ -f dist/server/index.mjs ] || MAIN=server.js
            [ -f "dist/server/$MAIN" ] || { echo "ERROR: no server entry found in dist/server"; ls -la dist/server; exit 1; }
            printf '%s\n' \
              '{' \
              '  "compatibility_date": "2025-09-24",' \
              '  "name": "tanstack-start-app",' \
              '  "compatibility_flags": ["nodejs_compat"],' \
              "  \"main\": \"$MAIN\"," \
              '  "assets": { "binding": "ASSETS", "directory": "../client" },' \
              '  "no_bundle": true,' \
              '  "rules": [{ "type": "ESModule", "globs": ["**/*.mjs", "**/*.js"] }]' \
              '}' > dist/server/wrangler.json

          fi
          cat dist/server/wrangler.json

      - name: Capture SSR-rendered HTML
        run: |
          bunx wrangler dev \
            --config dist/server/wrangler.json \
            --port 8788 --ip localhost --inspector-port 0 --local > /tmp/wrangler.log 2>&1 &
          WRANGLER_PID=$!



          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8788 2>/dev/null; then
              SERVER_READY=true
              break
            fi
            sleep 1
          done

          if [ "$SERVER_READY" != true ]; then
            echo "ERROR: wrangler dev did not start within 60 seconds"
            echo "--- wrangler log ---"
            cat /tmp/wrangler.log || true
            kill $WRANGLER_PID 2>/dev/null || true
            exit 1
          fi


          curl -sSL http://localhost:8788 > dist/client/index.html

          # Pre-render every page listed in the sitemap so deep links and hard
          # reloads (e.g. /templates/<slug>) resolve to a real HTML file.
          curl -sSL http://localhost:8788/sitemap.xml > /tmp/sitemap.xml
          cp /tmp/sitemap.xml dist/client/sitemap.xml
          PATHS=$(grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml \
            | sed -e 's|<loc>||' -e 's|</loc>||' \
            | sed -e 's|https\?://[^/]*||' \
            | grep -v '^/\?$' || true)

          for p in $PATHS; do
            case "$p" in
              */sitemap.xml) continue ;;
            esac
            out="dist/client${p%/}/index.html"
            mkdir -p "$(dirname "$out")"
            curl -sSL "http://localhost:8788${p}" > "$out"
            echo "Captured $out ($(wc -c < "$out") bytes)"
          done

          # SPA-style fallback for any unlisted path.
          cp dist/client/index.html dist/client/404.html

          kill $WRANGLER_PID 2>/dev/null || true
          wait $WRANGLER_PID 2>/dev/null || true

          SIZE=$(wc -c < dist/client/index.html)
          echo "Captured dist/client/index.html ($SIZE bytes)"
          if [ "$SIZE" -lt 100 ]; then
            echo "ERROR: captured HTML is too small ($SIZE bytes)"
            head -5 dist/client/index.html
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
